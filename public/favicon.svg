<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="sprintDeskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#4338ca" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="32" height="32" rx="8" fill="url(#sprintDeskGrad)" />
  
  <!-- Kanban Columns & Sprint Sparkle Shape -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Column 1 (Left Backlog/Progress) -->
    <rect x="6" y="8" width="4.5" height="14" rx="2" opacity="0.85" />
    <!-- Column 2 (Middle Active Focus) -->
    <rect x="13.75" y="8" width="4.5" height="16" rx="2" />
    <!-- Column 3 (Right Done/Ship) -->
    <rect x="21.5" y="8" width="4.5" height="10" rx="2" opacity="0.9" />
    <!-- Sparkle accent on Done -->
    <circle cx="23.75" cy="21.5" r="1.75" fill="#38bdf8" />
  </g>
</svg>